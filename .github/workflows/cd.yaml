name: CD

on:
  release:
    types:
      - released
      - prereleased
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string
      channel:
        description: Download channel to publish
        default: cn
        type: choice
        options: [cn, io, all]

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload-cli-artifact:
    strategy:
      matrix:
        channel: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["cn","io"]' || inputs.channel == 'all' && '["cn","io"]' || inputs.channel == 'io' && '["io"]' || '["cn"]') }}
        os: [linux, darwin]
        arch: [amd64, arm64]
    runs-on: cos-m
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      BASE_API_ENDPOINT: ${{ matrix.channel == 'cn' && 'https://openapi.coscene.cn' || 'https://openapi.coscene.io' }}
      DOWNLOAD_BASE_URL: ${{ matrix.channel == 'cn' && 'https://download.coscene.cn/' || 'https://download.coscene.io/' }}
      RELEASE_ARTIFACT_PATH: ${{ matrix.channel == 'cn' && format('bin/cocli-{0}-{1}', matrix.os, matrix.arch) || format('bin/cocli-{0}-{1}-{2}', matrix.channel, matrix.os, matrix.arch) }}
      PAYLOAD_NAME: ${{ format('{0}-{1}.gz', matrix.os, matrix.arch) }}
      METADATA_NAME: ${{ format('{0}-{1}.json', matrix.os, matrix.arch) }}
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      # Check version
      - name: Check if version is semantic
        run: echo "${RELEASE_TAG}" | grep -q -E '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-((0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
      - name: Check if version is release or beta
        run: |
          if echo "${RELEASE_TAG}" | grep -q -E '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'; then
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi
      
      # Build
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - name: Build cocli
        run: |
          CGO_ENABLED=0 GOOS="${TARGET_OS}" GOARCH="${TARGET_ARCH}" COCLI_BASE_API_ENDPOINT="${BASE_API_ENDPOINT}" COCLI_DOWNLOAD_BASE_URL="${DOWNLOAD_BASE_URL}" make build-binary
          cp bin/cocli cocli
          cp bin/cocli "${RELEASE_ARTIFACT_PATH}"
      
      # Upload to GitHub release
      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.RELEASE_ARTIFACT_PATH }}
  
      # Upload release payloads
      # (gzip is preinstalled on the cos-m runner — no apt-get needed)
      - name: Build release metadata files
        if: env.IS_RELEASE == 'true'
        run: |
          SHA256SUM=$(sha256sum cocli | awk '{printf "%s", $1}' | basenc --base16 -d | base64)
          echo "{\"Version\": \"${RELEASE_TAG}\", \"Sha256\": \"$SHA256SUM\"}" > "${METADATA_NAME}"
      - name: gzip cocli
        run: gzip cocli
      - name: Prepare release payloads
        run: |
          mkdir -p upload_version
          cp cocli.gz "upload_version/${PAYLOAD_NAME}"

          if [ "${IS_RELEASE}" = "true" ]; then
            mkdir -p upload_latest upload_metadata
            cp cocli.gz "upload_latest/${PAYLOAD_NAME}"
            cp "${METADATA_NAME}" "upload_metadata/${METADATA_NAME}"
          fi

          if [ "${TARGET_OS}" = "linux" ] && [ "${TARGET_ARCH}" = "amd64" ]; then
            sed "s#^DOWNLOAD_BASE_URL_DEFAULT=.*#DOWNLOAD_BASE_URL_DEFAULT=\"${DOWNLOAD_BASE_URL}\"#" scripts/install.sh > install.sh
            chmod +x install.sh
            mkdir -p upload_install
            cp install.sh upload_install/install.sh
          fi
      - name: Upload cocli to oss corresponding version
        if: matrix.channel == 'cn'
        # This action only applies timeout (seconds) to directory uploads.
        uses: tvrcgo/oss-action@982fb6ad6740b4245f428163e213302ddb9d5fd0
        with:
          key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          endpoint: https://oss-cn-hangzhou.aliyuncs.com
          region: oss-cn-hangzhou
          bucket: coscene-download
          timeout: 600
          assets: |
            upload_version/*:/cocli/${{ env.RELEASE_TAG }}/
      - name: Upload install script to oss
        if: matrix.channel == 'cn' && matrix.os == 'linux' && matrix.arch == 'amd64'
        uses: tvrcgo/oss-action@982fb6ad6740b4245f428163e213302ddb9d5fd0
        with:
          key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          endpoint: https://oss-cn-hangzhou.aliyuncs.com
          region: oss-cn-hangzhou
          bucket: coscene-download
          timeout: 600
          assets: |
            upload_install/*:/cocli/
      - name: Upload cocli to oss latest
        if: matrix.channel == 'cn' && env.IS_RELEASE == 'true'
        uses: tvrcgo/oss-action@982fb6ad6740b4245f428163e213302ddb9d5fd0
        with:
          key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          endpoint: https://oss-cn-hangzhou.aliyuncs.com
          region: oss-cn-hangzhou
          bucket: coscene-download
          timeout: 600
          assets: |
            upload_latest/*:/cocli/latest/
            upload_metadata/*:/cocli/
      - name: Upload cocli to s3 corresponding version
        if: matrix.channel == 'io'
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.S3_ARTIFACTS_ACCESS_KEY }}
          aws_secret_access_key: ${{ secrets.S3_ARTIFACTS_ACCESS_SECRET }}
          aws_bucket: coscene-download
          source_dir: upload_version
          destination_dir: cocli/${{ env.RELEASE_TAG }}/
      - name: Upload install script to s3
        if: matrix.channel == 'io' && matrix.os == 'linux' && matrix.arch == 'amd64'
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.S3_ARTIFACTS_ACCESS_KEY }}
          aws_secret_access_key: ${{ secrets.S3_ARTIFACTS_ACCESS_SECRET }}
          aws_bucket: coscene-download
          source_dir: upload_install
          destination_dir: cocli/
      - name: Upload cocli to s3 latest
        if: matrix.channel == 'io' && env.IS_RELEASE == 'true'
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.S3_ARTIFACTS_ACCESS_KEY }}
          aws_secret_access_key: ${{ secrets.S3_ARTIFACTS_ACCESS_SECRET }}
          aws_bucket: coscene-download
          source_dir: upload_latest
          destination_dir: cocli/latest/
      - name: Upload cocli metadata to s3
        if: matrix.channel == 'io' && env.IS_RELEASE == 'true'
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.S3_ARTIFACTS_ACCESS_KEY }}
          aws_secret_access_key: ${{ secrets.S3_ARTIFACTS_ACCESS_SECRET }}
          aws_bucket: coscene-download
          source_dir: upload_metadata
          destination_dir: cocli/
